name: 打包Mac版抖音下载器

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-mac-arm64:
    runs-on: macos-latest  # 使用GitHub的Mac电脑
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        playwright install chromium
    
    - name: 使用PyInstaller打包
      run: |
        pyinstaller --onefile \
          --name "DouyinDownloader" \
          --windowed \
          --hidden-import=tkinter \
          --hidden-import=requests \
          --hidden-import=beautifulsoup4 \
          --hidden-import=playwright \
          --add-data "$(python -c 'import playwright, os; print(os.path.dirname(playwright.__file__))'):playwright" \
          douyin_downloader.py
    
    - name: 上传打包好的程序
      uses: actions/upload-artifact@v4
      with:
        name: DouyinDownloader-Mac-M1
        path: dist/DouyinDownloader
        retention-days: 30

    - name: 创建压缩包
      run: |
        cd dist
        zip -r DouyinDownloader-Mac.zip DouyinDownloader
    
    - name: 上传压缩包
      uses: actions/upload-artifact@v4
      with:
        name: DouyinDownloader-Mac-ZIP
        path: dist/DouyinDownloader-Mac.zip
