name: Build for macOS ARM64

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-latest  # GitHub提供的macOS runner
    strategy:
      matrix:
        architecture: [arm64]  # M1芯片用arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install requests beautifulsoup4 playwright
        playwright install chromium

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile \
          --name "DouyinDownloader" \
          --target-architecture universal2 \
          --add-binary "/Users/runner/hostedtoolcache/Python/3.11.*/x64/lib/python3.11/site-packages/playwright/driver/node:./playwright/driver" \
          --hidden-import=playwright \
          --hidden-import=bs4 \
          --hidden-import=requests \
          douyin_downloader.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DouyinDownloader-macOS-ARM64
        path: dist/DouyinDownloader
