name: Build Mac M1 App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ 安装 Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # 3️⃣ 安装项目依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 4️⃣ 安装 Playwright 浏览器（你代码里用到）
      - name: Install Playwright browsers
        run: |
          python -m playwright install

      # 5️⃣ 使用 PyInstaller 打包成 macOS 单文件可执行程序
      - name: Build macOS executable (arm64)
        run: |
          pyinstaller --onefile --windowed --name DouyinDownloader --target-arch arm64 douyin_downloader.py

      # 6️⃣ 上传生成的可执行文件到 Actions artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: macos-app
          path: dist/DouyinDownloader
